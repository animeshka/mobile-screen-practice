<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мій екран</title>
  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #f0f0f0;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }

    .phone {
      width: 375px;
      min-height: 812px;
      background: #ffffff;
      border-radius: 40px;
      padding: 60px 24px 40px;
      overflow: hidden;
    }

    .screen-title {
      font-size: 28px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 8px;
    }

    .screen-subtitle {
      font-size: 15px;
      color: #888;
      margin-bottom: 32px;
    }

    .card {
      background: #f7f7f7;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 12px;
    }

  </style>
</head>
<body>

  <div class="phone">
    <h1 class="screen-title">Hello world👋</h1>
    <p class="screen-subtitle">My first screen</p>

    <div class="card">
      <p>Card 1</p>
    </div>

    <div class="card">
      <p>Card 2</p>
    </div>
  </div>

</body>
</html>
