<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Мій екран</title>
  <style>

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      background: #f0f0f0;
      display: flex;
      justify-content: center;
      padding: 40px 16px;
    }

    .phone {
      width: 375px;
      min-height: 812px;
      background: #ffffff;
      border-radius: 40px;
      padding: 60px 24px 40px;
      overflow: hidden;
    }

    .screen-title {
      font-size: 28px;
      font-weight: 600;
      color: #1a1a1a;
      margin-bottom: 8px;
    }

    .screen-subtitle {
      font-size: 15px;
      color: #888;
      margin-bottom: 32px;
    }

    .photo {
      width: 100%;
      height: 180px;
      object-fit: cover;
      border-radius: 24px;
      margin-bottom: 24px;
      display: block;
    }

    .card {
      background: #f7f7f7;
      border-radius: 16px;
      padding: 20px;
      margin-bottom: 12px;
    }

    .navbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 0 24px;
    }

    .menu-button {
      width: 44px;
      height: 44px;
      border: 1px solid #ddd;
      border-radius: 14px;
      background: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.08);
    }

    .menu-button span {
      display: block;
      width: 16px;
      height: 2px;
      background: #333;
      border-radius: 999px;
      box-shadow: 0 6px 0 #333, 0 -6px 0 #333;
    }

    .nav-title {
      font-size: 17px;
      font-weight: 600;
      color: #1a1a1a;
    }
  </style>
</head>
<body>

  <div class="phone">
    <div class="navbar">
      <button class="menu-button" aria-label="Open menu"><span></span></button>
      <div class="nav-title">Hello</div>
      <div style="width: 44px"></div>
    </div>
    <img class="photo" src="https://images.unsplash.com/photo-1776035352221-c64511ea32c7?q=80&w=1287&auto=format&fit=crop&ixlib=rb-4.1.0&ixid=M3wxMjA3fDB8MHxwaG90by1wYWdlfHx8fGVufDB8fHx8fA%3D%3D" alt="Top photo">
    <h1 class="screen-title">Hello world👋</h1>
    <p class="screen-subtitle">My first screen-nnmkljkljkl -hjkhkhjklj</p>

    <div class="card">
      <p>Card 1</p>
    </div>

    <div class="card">
      <p>Card 2</p>
    </div>
  </div>

</body>
</html>
